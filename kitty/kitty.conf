# ============================================================
# kitty.conf — converted from your alacritty.toml
# (colors intentionally left out — apply a theme separately with
#  `kitty +kitten themes`, or paste your alacritty colors back
#  and I'll write the color block too)
# ============================================================

# --- Shell ---------------------------------------------------
# alacritty: [terminal.shell] program + args
shell /usr/bin/zsh -l

# --- TERM ------------------------------------------------------
# alacritty: [env] TERM = "xterm-256color"
# Same reasoning applies to kitty: kitty defaults to TERM=xterm-kitty,
# which some remote machines / older apps don't have a terminfo entry
# for. Keep this if you SSH a lot; drop it if you mostly stay local
# and want kitty's full feature set advertised correctly.
term xterm-256color

# --- Font --------------------------------------------------------

font_family      CaskaydiaCove Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 10.6

# --- Window ------------------------------------------------------
# alacritty: [window] opacity = 0.85
background_opacity 0.85

# alacritty: [window] decorations = "None"
hide_window_decorations yes

# alacritty: [window] blur = true
# NOTE: this only works if your Wayland compositor implements blur
# behind transparent surfaces. Hyprland/KDE do; niri's support for
# this is not guaranteed — test it, and if nothing happens, that's
# why (it's a compositor limitation, not a kitty config mistake).
background_blur 20

# alacritty: [window] resize_increments = false
resize_in_steps no

# alacritty: [window.padding] x = 15, y = 15
window_padding_width 15

# --- No kitty equivalent (safe to ignore) ---
# working_directory   -> kitty always starts in the directory it was
#                        launched from; use `kitty --directory=PATH` instead
# decorations_theme_variant, startup_mode, dynamic_title, dynamic_padding
#   -> no matching kitty config option; decorations are already off above
# live_config_reload  -> kitty does NOT auto-reload on save. Reload
#                        manually with ctrl+shift+f5, or send SIGUSR1.
# WINIT_X11_SCALE_FACTOR -> alacritty-specific (winit toolkit); kitty
#                        doesn't use winit, so this is not needed

# --- Scrolling ---------------------------------------------------
# alacritty: [scrolling] history = 10000, multiplier = 3
scrollback_lines 10000
wheel_scroll_multiplier 3.0

# --- Selection / clipboard -----------------------------------------------
# alacritty: [selection] save_to_clipboard = true
copy_on_select clipboard

# --- Cursor ------------------------------------------------------
# alacritty: [cursor] shape = "Underline", blinking = "Off"
cursor_shape underline
cursor_blink_interval 0

cursor_trail 1
cursor_trail_decay 0.2 0.5
cursor_trail_start_threshold 2
cursor_trail_start_threshold 0

# alacritty: [cursor] unfocused_hollow = true
cursor_shape_unfocused hollow

# alacritty: [cursor] thickness = 0.15
# NOTE: units differ. Alacritty's thickness is a fraction of the cell
# size (0.15 = 15%); kitty's is in points. This is a starting guess —
# nudge it up/down to match what 0.15 looked like for you.
cursor_underline_thickness 1.5

# --- Mouse ------------------------------------------------------

# alacritty: [mouse.bindings] Middle click (no mods) = PasteSelection
mouse_map middle release ungrabbed paste_from_selection

# --- Keybindings ------------------------------------------------------
# alacritty: Ctrl+Shift+V = Paste, Ctrl+Shift+C = Copy
# (kitty already binds these by default — added explicitly for clarity)
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+c copy_to_clipboard

# alacritty: Shift+PageUp/PageDown = ScrollPageUp/Down
map shift+page_up scroll_page_up
map shift+page_down scroll_page_down

# alacritty: Shift+Home/End = ScrollToTop/Bottom
map shift+home scroll_home
map shift+end scroll_end

# alacritty: Ctrl+0 = ResetFontSize
map ctrl+0 change_font_size all 0

# --- Dropped intentionally (no clean kitty equivalent) ---
# Ctrl+L -> ClearLogNotice: alacritty-only feature (its own on-screen
#           notice banner), kitty has nothing like it.
# Ctrl+L -> sends \f in ~Vi mode: not needed, your shell (zsh) already
#           clears the screen on Ctrl+L on its own — kitty doesn't
#           need to intercept this.
# Ctrl+Shift+F / Ctrl+Shift+B -> SearchForward/Backward: kitty has no
#           built-in incremental scrollback search bound to a hotkey.
#           Closest native option: ctrl+shift+h opens your scrollback
#           in a pager (less), where "/" searches forward and "?"
#           searches backward. For something closer to what you had,
#           look into the community "kitty_scrollback_nvim" kitten.
# Ctrl+Shift+C in Vi mode -> ClearSelection: kitty has no modal
#           vi-style scrollback navigation, so there's no mode to bind this in.
# Dedicated "Paste"/"Copy" media keys: only exist on certain keyboards.
#           Skipped — add `map media_paste paste_from_clipboard` style
#           bindings yourself if your keyboard actually has these keys.



include themes/noctalia.conf
